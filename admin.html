<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Desa Sepadu</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f3f0e6;
            color: #333;
        }

        /* NAVBAR */
        nav {
            background: #6b8e23;
            color: white;
            padding: 16px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .home {
            text-decoration: none;
            color: white;
            background: #8b6f47;
            padding: 9px 18px;
            border-radius: 20px;
        }

        /* LOGIN */
        #loginPage {
            min-height: 90vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            background: white;
            width: 380px;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .login-box h1 {
            color: #6b8e23;
            margin-bottom: 10px;
        }

        .login-box p {
            color: #777;
            margin-bottom: 25px;
        }

        .login-box input {
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 15px;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #6b8e23;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #526d1b;
        }

        #pesan {
            margin-top: 15px;
            font-weight: bold;
        }

        /* DASHBOARD */
        #dashboard {
            display: none;
            padding: 40px 7%;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .dashboard-header h1 {
            color: #6b8e23;
        }

        .logout {
            border: none;
            background: #8b6f47;
            color: white;
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
        }

        /* CARD */
        .cards {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .card {
            flex: 1;
            min-width: 200px;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .card h2 {
            color: #6b8e23;
            margin-top: 10px;
        }

        /* TABLE */
        .table-box {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            overflow-x: auto;
        }

        .table-box h2 {
            color: #6b8e23;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th {
            background: #6b8e23;
            color: white;
            padding: 12px;
            text-align: left;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        .status {
            padding: 6px 10px;
            border-radius: 20px;
            background: #dce8bd;
            color: #526d1b;
            font-size: 13px;
        }

        .ubah-status {
            margin-top: 7px;
            padding: 6px;
            border-radius: 7px;
            border: 1px solid #ccc;
        }

        @media(max-width:700px) {

            .dashboard-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .login-box {
                width: 90%;
            }
        }

        .status-select {
    padding: 8px 12px;
    border: 1px solid #8a9a5b;
    border-radius: 8px;
    background: #f5f1df;
    color: #3d4a22;
    font-weight: 600;
    cursor: pointer;
}

.status-select:focus {
    outline: none;
    border-color: #6b8e23;
}
    </style>
</head>

<body>

<!-- NAVBAR -->

<nav>

    <div class="logo">
        🌿 Desa Sepadu
    </div>

    <a href="index.html" class="home">
        ← Beranda
    </a>

</nav>


<!-- LOGIN -->

<section id="loginPage">

    <div class="login-box">

        <div class="icon">
            🔐
        </div>

        <h1>Login Admin</h1>

        <p>
            Admin Desa Sepadu
        </p>

        <input
            type="password"
            id="password"
            placeholder="Masukkan password"
        >

        <button
            class="login-btn"
            onclick="login()">

            🔑 Masuk

        </button>

        <div id="pesan"></div>

    </div>

</section>


<!-- DASHBOARD -->

<section id="dashboard">

    <div class="dashboard-header">

        <div>

            <h1>Dashboard Admin</h1>

            <p>
                Data Pengaduan Masyarakat Desa Sepadu
            </p>

        </div>

        <button
            class="logout"
            onclick="logout()">

            🚪 Keluar

        </button>

    </div>


    <!-- STATISTIK -->

    <div class="cards">

        <div class="card">

            <span>📋</span>

            <h2 id="total">
                0
            </h2>

            <p>Total Pengaduan</p>

        </div>


        <div class="card">

            <span>⏳</span>

            <h2 id="belum">
                0
            </h2>

            <p>Belum Diproses</p>

        </div>


        <div class="card">

            <span>✅</span>

            <h2 id="selesai">
                0
            </h2>

            <p>Selesai</p>

        </div>

    </div>


    <!-- DATA -->

    <div class="table-box">

        <h2>
            📢 Pengaduan Masyarakat
        </h2>

        <table>

            <thead>

                <tr>

                    <th>No</th>
                    <th>Token</th>
                    <th>Tanggal</th>
                    <th>Nama</th>
                    <th>Kontak</th>
                    <th>Kategori</th>
                    <th>Pengaduan</th>
                    <th>Status</th>

                </tr>

            </thead>

            <tbody id="dataPengaduan">

                <tr>

                    <td colspan="8"
                        style="text-align:center">

                        Memuat data...

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</section>


<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbyL41wzwaoKCWK_t7Ktb_DIqDJbP8ZvL6QZ_VhjBmwNNeeU5pP25fJSP7p_lHntfqhvLw/exec";


// =====================================
// LOGIN ADMIN
// =====================================

function login() {

    const password =
        document.getElementById("password").value;

    const pesan =
        document.getElementById("pesan");

    pesan.innerHTML =
        "⏳ Memeriksa password...";

    const script =
        document.createElement("script");

    script.src =
        API_URL +
        "?action=loginAdmin" +
        "&password=" +
        encodeURIComponent(password) +
        "&callback=callbackLogin" +
        "&t=" +
        Date.now();

    document.body.appendChild(script);

}


// =====================================
// HASIL LOGIN
// =====================================

window.callbackLogin =
function(data) {

    const pesan =
        document.getElementById("pesan");

    if (data.success) {

        // Simpan token admin
        sessionStorage.setItem(
            "adminToken",
            data.token
        );

        document.getElementById(
            "loginPage"
        ).style.display = "none";

        document.getElementById(
            "dashboard"
        ).style.display = "block";

        pesan.innerHTML = "";

        ambilData();

    } else {

        pesan.innerHTML =
            "❌ " + data.message;

        pesan.style.color = "red";

    }

};


// =====================================
// AMBIL DATA PENGADUAN
// =====================================

function ambilData() {

    const adminToken =
        sessionStorage.getItem(
            "adminToken"
        );

    if (!adminToken) {

        kembaliLogin();

        return;

    }


    const script =
        document.createElement("script");

    script.src =
        API_URL +
        "?action=ambilPengaduan" +
        "&adminToken=" +
        encodeURIComponent(adminToken) +
        "&callback=callbackData" +
        "&t=" +
        Date.now();

    document.body.appendChild(script);

}


// =====================================
// HASIL DATA
// =====================================

window.callbackData =
function(data) {

    if (!data.success) {

        alert(data.message);

        kembaliLogin();

        return;

    }

    tampilkanData(data.data);

};


// =====================================
// TAMPILKAN DATA
// =====================================

function tampilkanData(data) {

    const tbody =
        document.getElementById(
            "dataPengaduan"
        );

    if (!tbody) return;


    tbody.innerHTML = "";


    if (data.length === 0) {

        tbody.innerHTML = `

            <tr>

                <td
                    colspan="8"
                    style="
                        text-align:center;
                        padding:25px;
                    "
                >

                    📭 Belum ada pengaduan.

                </td>

            </tr>

        `;

        updateStatistik([]);

        return;

    }


    data.forEach(function(item) {

        const tr =
            document.createElement("tr");


        const tanggal =
            formatTanggal(
                item.tanggal
            );


        tr.innerHTML = `

            <td>
                ${escapeHTML(
                    String(item.token || "")
                )}
            </td>

            <td>
                ${escapeHTML(
                    String(item.nama || "")
                )}
            </td>

            <td>
                ${escapeHTML(
                    String(item.kontak || "")
                )}
            </td>

            <td>
                ${escapeHTML(
                    String(item.kategori || "")
                )}
            </td>

            <td>
                ${escapeHTML(
                    String(item.pengaduan || "")
                )}
            </td>

            <td>
                ${tanggal}
            </td>

            <td>

                <select
                    onchange="
                        ubahStatus(
                            ${item.row},
                            this.value
                        )
                    "
                    class="status-select"
                >

                    <option
                        value="Belum Diproses"
                        ${item.status === "Belum Diproses"
                            ? "selected"
                            : ""}
                    >
                        Belum Diproses
                    </option>

                    <option
                        value="Sedang Diproses"
                        ${item.status === "Sedang Diproses"
                            ? "selected"
                            : ""}
                    >
                        Sedang Diproses
                    </option>

                    <option
                        value="Selesai"
                        ${item.status === "Selesai"
                            ? "selected"
                            : ""}
                    >
                        Selesai
                    </option>

                </select>

            </td>

        `;

        tbody.appendChild(tr);

    });


    updateStatistik(data);

};


// =====================================
// UBAH STATUS
// =====================================

function ubahStatus(row, status) {

    const adminToken =
        sessionStorage.getItem(
            "adminToken"
        );

    if (!adminToken) {

        kembaliLogin();

        return;

    }


    const script =
        document.createElement("script");


    script.src =
        API_URL +
        "?action=ubahStatus" +
        "&adminToken=" +
        encodeURIComponent(adminToken) +
        "&row=" +
        encodeURIComponent(row) +
        "&status=" +
        encodeURIComponent(status) +
        "&callback=callbackStatus" +
        "&t=" +
        Date.now();


    document.body.appendChild(script);

}


// =====================================
// HASIL STATUS
// =====================================

window.callbackStatus =
function(data) {

    if (data.success) {

        // Ambil ulang data
        ambilData();

    } else {

        alert(
            "❌ " +
            data.message
        );

    }

};


// =====================================
// STATISTIK
// =====================================

function updateStatistik(data) {

    let total = data.length;

    let belum = 0;

    let proses = 0;

    let selesai = 0;


    data.forEach(function(item) {

        if (
            item.status ===
            "Belum Diproses"
        ) {

            belum++;

        }

        else if (
            item.status ===
            "Sedang Diproses"
        ) {

            proses++;

        }

        else if (
            item.status ===
            "Selesai"
        ) {

            selesai++;

        }

    });


    // Total
    const totalElement =
        document.getElementById(
            "totalPengaduan"
        );

    if (totalElement) {

        totalElement.innerText =
            total;

    }


    // Belum
    const belumElement =
        document.getElementById(
            "belumDiproses"
        );

    if (belumElement) {

        belumElement.innerText =
            belum;

    }


    // Proses
    const prosesElement =
        document.getElementById(
            "sedangDiproses"
        );

    if (prosesElement) {

        prosesElement.innerText =
            proses;

    }


    // Selesai
    const selesaiElement =
        document.getElementById(
            "selesai"
        );

    if (selesaiElement) {

        selesaiElement.innerText =
            selesai;

    }

}


// =====================================
// LOGOUT
// =====================================

function logout() {

    sessionStorage.removeItem(
        "adminToken"
    );

    document.getElementById(
        "dashboard"
    ).style.display = "none";

    document.getElementById(
        "loginPage"
    ).style.display = "block";

    document.getElementById(
        "password"
    ).value = "";

}


// =====================================
// KEMBALI KE LOGIN
// =====================================

function kembaliLogin() {

    sessionStorage.removeItem(
        "adminToken"
    );

    document.getElementById(
        "dashboard"
    ).style.display = "none";

    document.getElementById(
        "loginPage"
    ).style.display = "block";

}


// =====================================
// FORMAT TANGGAL
// =====================================

function formatTanggal(tanggal) {

    if (!tanggal) {
        return "-";
    }

    try {

        const d =
            new Date(tanggal);

        return d.toLocaleString(
            "id-ID",
            {
                day: "2-digit",
                month: "2-digit",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit"
            }
        );

    } catch (error) {

        return tanggal;

    }

}


// =====================================
// KEAMANAN HTML
// =====================================

function escapeHTML(text) {

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


// =====================================
// CEK LOGIN SAAT HALAMAN DIBUKA
// =====================================

window.addEventListener(
    "load",
    function() {

        const token =
            sessionStorage.getItem(
                "adminToken"
            );

        if (token) {

            document.getElementById(
                "loginPage"
            ).style.display = "none";

            document.getElementById(
                "dashboard"
            ).style.display = "block";

            ambilData();

        }

    }
);

</script>
</body>
</html>
